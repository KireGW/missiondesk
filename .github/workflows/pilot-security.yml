name: Pilot Security

on:
  push:
    branches: [codex/personal-profiles-norway]
  pull_request:
    branches: [codex/personal-profiles-norway]

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run security:audit
      - run: npm run lint
      - run: npm run smoke:security-headers
      - run: npm run smoke:product
      - run: npm run smoke:pilot-access
      - run: npm run smoke:personal-profiles
      - run: npm run smoke:legal
      - run: npm run smoke:workspace-ranking
      - run: npm run smoke:workspace-feed
      - run: npm run smoke:workspace-refresh
      - run: npm run smoke:workspace-search
